<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Sky Hopper</title>
  <link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #0b1020;
    overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    height: 100vh; max-width: 100vw; aspect-ratio: 360 / 600;
    background: #7ad7f0; touch-action: none; display: block;
  }
</style>
</head>
<body>
<canvas id="c" width="360" height="600"></canvas>

<script>
  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
  }
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = 360, H = 600, GROUND = 70;

const GRAVITY = 1500, FLAP = -430;
const PIPE_W = 60, GAP = 160, PIPE_SPACE = 210;

let state = "ready";
let bird, pipes, score, best = 0, speed, groundX, time = 0;
try { best = parseInt(localStorage.getItem("skyHopperBest")) || 0; } catch (e) {}

let soundOn = true, audioCtx;
function beep(freq, dur, type) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function reset() {
  bird = { x: 90, y: H / 2 - 40, vy: 0, r: 14 };
  pipes = [];
  score = 0;
  speed = 150;
  groundX = 0;
}

function addPipe(x) {
  const min = 70, max = H - GROUND - GAP - 70;
  const top = min + Math.random() * (max - min);
  pipes.push({ x: x, top: top, passed: false });
}

function flap() {
  if (state === "ready") {
    state = "play";
    reset();
    addPipe(W + 60);
  }
  if (state === "play") {
    bird.vy = FLAP;
    beep(520, 0.07, "triangle");
  } else if (state === "over" && time > overAt + 0.5) {
    state = "ready";
    reset();
  }
}

let overAt = 0;
function gameOver() {
  state = "over";
  overAt = time;
  beep(140, 0.35, "sawtooth");
  if (score > best) {
    best = score;
    try { localStorage.setItem("skyHopperBest", best); } catch (e) {}
  }
}

function update(dt) {
  groundX = (groundX + speed * dt) % 24;
  if (state !== "play") {
    if (state === "ready") bird.y = H / 2 - 40 + Math.sin(time * 4) * 8;
    return;
  }

  bird.vy += GRAVITY * dt;
  bird.y += bird.vy * dt;
  speed = 150 + Math.min(score * 4, 90);

  pipes.forEach(p => p.x -= speed * dt);
  if (pipes.length && pipes[0].x < -PIPE_W - 10) pipes.shift();
  const last = pipes[pipes.length - 1];
  if (!last || last.x < W - PIPE_SPACE) addPipe(W + 20);

  pipes.forEach(p => {
    if (!p.passed && p.x + PIPE_W < bird.x) {
      p.passed = true;
      score++;
      beep(880, 0.08, "square");
    }
  });

  if (bird.y + bird.r >= H - GROUND) { bird.y = H - GROUND - bird.r; gameOver(); return; }
  if (bird.y - bird.r <= 0) { bird.y = bird.r; bird.vy = 0; }

  for (const p of pipes) {
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
    if (inX && (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP)) {
      gameOver();
      return;
    }
  }
}

function drawPipe(p) {
  const bottomY = p.top + GAP;
  const bottomH = H - GROUND - bottomY;
  ctx.fillStyle = "#2f9e44";
  ctx.fillRect(p.x, 0, PIPE_W, p.top);
  ctx.fillRect(p.x, bottomY, PIPE_W, bottomH);
  ctx.fillStyle = "#51cf66";
  ctx.fillRect(p.x - 4, p.top - 22, PIPE_W + 8, 22);
  ctx.fillRect(p.x - 4, bottomY, PIPE_W + 8, 22);
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.fillRect(p.x + PIPE_W - 10, 0, 10, p.top - 22);
  ctx.fillRect(p.x + PIPE_W - 10, bottomY + 22, 10, bottomH - 22);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const tilt = Math.max(-0.5, Math.min(1.1, bird.vy / 600));
  ctx.rotate(tilt);
  ctx.fillStyle = "#ff922b";
  ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd43b";
  ctx.beginPath(); ctx.ellipse(-4, 4 + Math.sin(time * 25) * 2, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(6, -4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(8, -4, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#e8590c";
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 3); ctx.lineTo(12, 7); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function text(str, x, y, size, color) {
  ctx.font = "bold " + size + "px Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.lineWidth = 5;
  ctx.strokeStyle = "rgba(0,0,0,0.45)";
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color || "#fff";
  ctx.fillText(str, x, y);
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#4dabf7");
  g.addColorStop(1, "#d0ebff");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(255,255,255,0.8)";
  [[60, 110, 26], [90, 110, 20], [250, 190, 24], [280, 192, 18], [150, 300, 22]].forEach(c => {
    ctx.beginPath(); ctx.arc((c[0] - time * 6 % 420 + 420) % 420 - 30, c[1], c[2], 0, Math.PI * 2); ctx.fill();
  });

  pipes.forEach(drawPipe);

  ctx.fillStyle = "#e9c46a";
  ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = "#74c69d";
  ctx.fillRect(0, H - GROUND, W, 14);
  ctx.fillStyle = "#52b788";
  for (let x = -24 + (24 - groundX); x < W; x += 24) ctx.fillRect(x, H - GROUND, 12, 14);

  drawBird();

  if (state === "play") {
    text(String(score), W / 2, 80, 54);
  } else if (state === "ready") {
    text("Sky Hopper", W / 2, 170, 44, "#fff3bf");
    text("Tap to fly", W / 2, 330, 26);
    text("Best: " + best, W / 2, 370, 20, "#ffe066");
  } else {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, H);
    text("Game Over", W / 2, 220, 44, "#ff8787");
    text("Score: " + score, W / 2, 275, 28);
    text("Best: " + best, W / 2, 312, 24, "#ffe066");
    if (score > 0 && score === best) text("New High Score!", W / 2, 350, 22, "#8ce99a");
    text("Tap to play again", W / 2, 420, 22);
  }
}

let lastT = 0;
function loop(t) {
  const dt = Math.min((t - lastT) / 1000 || 0, 0.033);
  lastT = t;
  time += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "ArrowUp") { e.preventDefault(); flap(); }
  if (e.key === "m") soundOn = !soundOn;
});

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
